# Temporary hosted verification; not part of the Ask integration commits.
name: Ask Review Tests
on:
  workflow_dispatch:
jobs:
  swift-test:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout exact review commit
        uses: actions/checkout@v6
        with:
          ref: bc4a46a798cf5de4958c9de516d5f7c8b28db93a
      - name: Verify source commit
        run: test "$(git rev-parse HEAD)" = bc4a46a798cf5de4958c9de516d5f7c8b28db93a
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.1"
      - name: Cache SwiftPM Dependencies
        uses: actions/cache@v5
        with:
          path: |
            .build/checkouts
            .build/repositories
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Ask Pi Helper
        timeout-minutes: 5
        env:
          MACPARAKEET_ASK_TEST_HELPER: ${{ github.workspace }}/.build/ask-runtime/AskAgentHelper/ask-helper.cjs
        run: |
          set -euo pipefail
          scripts/build_ask_helper.sh .build/ask-runtime/AskAgentHelper .build/ask-runtime/node
          .build/ask-runtime/node --test Sources/AskAgentHelper/test/*.test.js

      - name: Swift Test
        timeout-minutes: 25
        env:
          MACPARAKEET_ASK_TEST_NODE: ${{ github.workspace }}/.build/ask-runtime/node
        run: |
          mkdir -p .ci-logs
          set -o pipefail
          swift test --parallel 2>&1 | tee .ci-logs/swift-test.log

      - name: Upload CI Logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swift-ci-logs
          path: .ci-logs/
          if-no-files-found: ignore
          retention-days: 7
